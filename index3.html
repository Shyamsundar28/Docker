<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Startup Landing Page</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .hero {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      text-align: center;
      padding: 100px 20px;
    }
    .hero h1 { font-size: 3em; }
    .hero p { font-size: 1.2em; }
    .cta-button {
      background: white;
      color: #0072ff;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Launch Your Product Now</h1>
    <p>Simple, elegant, and fast websites made easy.</p>
    <button class="cta-button">Get Started</button>
  </div>
</body>
</html>
